# List of items to watch on the Undermine Exchange Auction House.
#
# Fields:
#   name          - Just a label for display, doesn't affect the query.
#   item_id       - WoW item ID (look it up on wowhead.com/item=ID).
#   region        - one of: us, eu, tw, kr
#   commodity     - true for stackable trade-goods sold on the region-wide
#                   Commodity AH (ore, herbs, cloth, etc). false for gear,
#                   mounts, pets, etc which are realm-specific.
#   realm         - required only when commodity is false. Realm slug, e.g.
#                   drakthul, burning-blade, etc. Connected realms share one
#                   AH, so any realm slug in that connected group works.
#   max_price_gold - alert when the price drops to or below this (in gold).

items:
  - name: Petrified Root
    item_id: 251285
    region: eu
    commodity: true
    max_price_gold: 400
